<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swansizz Space</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="video-container">
        <video id="bgVideo" muted playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>
    </div>
    
    <div class="content-overlay blurred" id="mainOverlay">
        
        <div class="enter-text" id="enterTxt">CLICK TO ENTER</div>
 
        <div class="glass-panel" id="interactionPanel">
            <div class="discord-profile" id="discordProfile">
                <div class="avatar-container">
                    <img id="discordAvatar" src="" alt="">
                    <span id="discordStatus" class="status-dot"></span>
                </div>
                <div class="discord-info">
                    <div id="discordName" class="discord-name"></div>
                    <div id="discordActivity" class="discord-activity"></div>
                </div>
                <div class="profile-content" id="profileContent">
                    <div class="social-icons">
                        <a href="https://github.com/ladydarknes" target="_blank" class="icon-btn github" aria-label="GitHub">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
                        </a>
                        <a href="https://open.spotify.com/user/uty0u4fhlpbuuu6erz47b88ac" target="_blank" class="icon-btn spotify" aria-label="Spotify">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.586 14.424c-.18.295-.565.387-.86.207-2.377-1.454-5.37-1.783-8.893-.982-.336.075-.668-.135-.744-.47-.077-.336.135-.668.47-.745 3.856-.88 7.15-.51 9.822 1.128.296.178.387.563.206.86zm1.224-2.723c-.226.367-.706.487-1.074.26-2.72-1.672-6.87-2.157-10.082-1.182-.413.125-.847-.107-.972-.52-.125-.413.108-.847.52-.972 3.674-1.114 8.243-.574 11.35 1.335.366.226.486.706.258 1.074zm.105-2.833C14.452 8.71 8.746 8.52 5.436 9.525c-.514.156-1.05-.133-1.206-.648-.156-.514.133-1.05.648-1.206 3.8-1.153 10.103-.928 14.09 1.438.463.275.614.872.34 1.335-.275.463-.873.614-1.336.34z"/></svg>
                        </a>
                    </div>
                </div>
            </div>

            <div class="spotify-status" id="spotifyStatusContainer">
                <svg viewBox="0 0 24 24" fill="currentColor" class="spotify-status-icon"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.586 14.424c-.18.295-.565.387-.86.207-2.377-1.454-5.37-1.783-8.893-.982-.336.075-.668-.135-.744-.47-.077-.336.135-.668.47-.745 3.856-.88 7.15-.51 9.822 1.128.296.178.387.563.206.86zm1.224-2.723c-.226.367-.706.487-1.074.26-2.72-1.672-6.87-2.157-10.082-1.182-.413.125-.847-.107-.972-.52-.125-.413.108-.847.52-.972 3.674-1.114 8.243-.574 11.35 1.335.366.226.486.706.258 1.074zm.105-2.833C14.452 8.71 8.746 8.52 5.436 9.525c-.514.156-1.05-.133-1.206-.648-.156-.514.133-1.05.648-1.206 3.8-1.153 10.103-.928 14.09 1.438.463.275.614.872.34 1.335-.275.463-.873.614-1.336.34z"/></svg>

            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
