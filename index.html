<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0-0</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }
        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        #bgVideo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: auto;
            height: auto;
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            filter: brightness(0.5);
        }
        .content-overlay {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            pointer-events: none;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 50px 70px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            cursor: pointer;
            pointer-events: auto; 
            transition: all 0.3s ease;
        }
        .glass-panel:hover {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 12px 48px rgba(0,0,0,0.6);
        }
        h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        p {
            font-size: 1rem;
            color: #ccc;
            letter-spacing: 1px;
        }
        .playing-info {
            margin-top: 30px;
            display: none;
        }
        .playing-info h2 {
            font-size: 1.2rem;
            font-weight: 400;
            color: #00e676;
        }
    </style>
</head>
<body>
    <div id="video-container">
        <video id="bGVideo" loop muted>
            <source src="video.mp4" type="video/mp4">
        </video>
    </div>
    <div class="content-overlay">
        
        <div class="glass-panel" id="interactionPanel">
            <h1>TESTSWANSIZZ</h1>
            
            <div class="playing-info" id="playingStatus">
            </div>
        </div>

    </div>
    <script>
        const video = document.getElementById('bgVideo');
        const panel = document.getElementById('interactionPanel');
        const status = document.getElementById('playingStatus');
        const instruction = panel.querySelector('p');
        panel.addEventListener('click', () => {
            video.muted = false;
            video.play().then(() => {
                instruction.style.display = 'none'; 
                status.style.display = 'block';
            });
        }, { once: true });
    </script>

</body>
</html>
